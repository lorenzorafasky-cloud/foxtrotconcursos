services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foxtrot
      POSTGRES_PASSWORD: foxtrot
      POSTGRES_DB: foxtrot
    ports:
      - "5432:5432"
    volumes:
      - foxtrot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxtrot -d foxtrot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - foxtrot_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  foxtrot_postgres:
  foxtrot_redis:
