name: CI

on:
  push:
    branches: ["master", "main", "codex/desenvolvimento-neon"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @foxtrot/database db:generate
      - run: pnpm --filter @foxtrot/api test
      - run: pnpm --filter @foxtrot/api lint
      - run: pnpm --filter @foxtrot/worker lint
      - run: pnpm --filter @foxtrot/ui test
      - run: pnpm --filter @foxtrot/aluno build
      - run: pnpm --filter @foxtrot/admin build
      - run: pnpm --filter @foxtrot/professor build

  # Os testes E2E (Playwright) exigem Postgres, Redis, seed e os apps rodando.
  # Rode-os localmente com `docker compose up` + `pnpm dev` + `pnpm db:seed` + `pnpm e2e`,
  # ou contra staging definindo E2E_ALUNO_URL/E2E_ADMIN_URL/E2E_PROFESSOR_URL.
  # Quando houver ambiente de staging, adicione aqui um job dedicado com services.
